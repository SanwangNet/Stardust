<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Stardust 服务状态" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
    <title>Stardust · 服务状态</title>
    <script type="module" src="/main.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <a class="brand" href="#/overview/status" aria-label="Stardust 概览"><span class="brand-mark" aria-hidden="true">✦</span><span>STARDUST</span></a>
        <nav id="primary-nav" class="primary-nav" aria-label="一级分类"></nav>
        <div class="header-controls">
          <div class="connection" role="status"><span class="status-dot" id="connection-dot" aria-hidden="true"></span><span id="connection-label">正在检测连接</span></div>
          <label class="theme-control" for="theme-select"><span>主题</span><select id="theme-select" aria-label="主题"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label>
        </div>
      </header>

      <div class="workspace">
        <aside class="sidebar" aria-label="分类菜单">
          <button id="menu-toggle" class="menu-toggle" type="button" aria-expanded="false" aria-controls="secondary-nav"><span id="menu-toggle-label">菜单</span><span aria-hidden="true">⌄</span></button>
          <div id="sidebar-heading" class="sidebar-heading"></div>
          <nav id="secondary-nav" class="secondary-nav" aria-label="当前分类菜单"></nav>
        </aside>

        <main class="main" id="main-content">
          <div class="page-heading">
            <div class="heading-copy"><p class="eyebrow" data-transition-order="0"><span aria-hidden="true"></span><span id="page-breadcrumb">STARDUST / 概览</span></p><h1 id="page-title" data-transition-order="1" tabindex="-1">运行概况</h1></div>
            <button type="button" id="refresh-button" class="refresh-button" data-transition-order="2"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5"/><path d="M4 17v-5h5"/><path d="M6.1 9a7 7 0 0 1 12-1.8L20 12M4 12l1.9 2.8A7 7 0 0 0 18 15"/></svg><span id="refresh-label">刷新状态</span></button>
          </div>

          <div id="page-stage" class="page-stage">
          <section id="page-overview" class="status-section nav-page" data-page="/overview/status" aria-labelledby="main-status">
            <div class="section-label" data-transition-order="3"><span>服务连接</span></div>
            <div class="status-main" data-transition-order="4"><div class="status-symbol" aria-hidden="true"><span></span></div><div class="status-copy" role="status" aria-live="polite"><h2 id="main-status">正在检查服务</h2><p id="status-description">正在请求服务状态</p></div></div>
            <dl class="metrics" data-transition-order="5"><div class="metric"><dt>后端版本</dt><dd id="server-version">—</dd></div><div class="metric"><dt>运行时间</dt><dd id="server-uptime">—</dd></div><div class="metric"><dt>最近检查</dt><dd id="last-checked">—</dd></div></dl>
          </section>

          <section class="nav-page content-section model-chat" data-page="/model/chat" hidden>
            <div id="tool-admin" class="tool-admin" data-transition-order="1">
              <p id="tool-admin-status" role="status"></p>
              <form id="tool-admin-form" hidden><label for="tool-admin-token">管理员口令</label><input id="tool-admin-token" type="password" autocomplete="current-password"><button type="submit" class="setup-secondary">登录以使用 Tool</button></form>
            </div>
            <div id="chat-messages" class="chat-messages" data-transition-order="2" aria-live="polite"></div>
            <form id="chat-form"><label data-transition-order="3" for="chat-input">消息</label><textarea data-transition-order="4" id="chat-input" rows="4" maxlength="16000" required></textarea><button data-transition-order="5" class="setup-primary" type="submit" id="chat-send">发送</button><p data-transition-order="6" id="chat-status" class="model-feedback" role="status" aria-live="polite"></p></form>
          </section>
          <section class="nav-page content-section" data-page="/model/logs" hidden>
            <div data-transition-order="2" class="log-panel">
              <div class="log-toolbar"><span id="log-connection" role="status">日志服务未连接</span><div class="log-actions"><button id="log-pause" type="button" class="setup-secondary">暂停更新</button><button id="log-copy" type="button" class="setup-secondary">复制日志</button><button id="log-clear" type="button" class="setup-secondary">清空显示</button></div></div>
              <div id="log-list" class="log-list" tabindex="0" aria-label="运行日志"></div>
            </div>
          </section>

          <section class="nav-page content-section model-settings" data-page="/model/service/config" hidden>
            <form id="model-form">
              <label data-transition-order="2">API Base URL<input id="model-url" type="url" placeholder="https://example.com/v1" required></label>
              <label data-transition-order="3">模型 ID<input id="model-id" required></label>
              <label data-transition-order="4">请求超时（毫秒）<input id="model-timeout" type="number" min="1000" max="120000" step="1" required></label>
              <label class="model-check" data-transition-order="5"><input id="model-stream" type="checkbox"> 流式请求</label>
              <label data-transition-order="6">API Key<input id="model-key" type="password" autocomplete="new-password" placeholder="留空以保留已保存的密钥"></label>
              <p data-transition-order="7" id="model-key-status" class="model-note"></p>
              <label class="model-check" data-transition-order="8"><input id="model-clear-key" type="checkbox"> 清除文件中保存的 API Key</label>
              <div class="model-actions" data-transition-order="9"><button class="setup-primary" type="submit" id="model-save">保存配置</button></div>
              <p data-transition-order="10" id="model-status" class="model-feedback" role="status" aria-live="polite"></p>
            </form>
          </section>

          <section class="nav-page content-section" data-page="/model/service/test" hidden>
            <p data-transition-order="2" class="section-copy">测试当前已保存的模型配置。</p>
            <button data-transition-order="3" class="setup-primary" type="button" id="model-test">测试连接</button>
            <p data-transition-order="4" id="model-test-status" class="model-feedback" role="status" aria-live="polite"></p>
          </section>
          <section class="nav-page content-section" data-page="/extensions/installed" hidden><div id="extension-list" data-transition-order="2"></div><p id="extension-feedback" class="model-feedback" role="status" aria-live="polite"></p></section>
          <section class="nav-page content-section" data-page="/settings/general" hidden><dl class="settings-list"><div data-transition-order="2"><dt>产品名称</dt><dd>Stardust</dd></div><div data-transition-order="3"><dt>WebUI 标题</dt><dd id="settings-web-title">—</dd></div></dl></section>
          <section class="nav-page content-section" data-page="/settings/server" hidden><dl class="settings-list"><div data-transition-order="2"><dt>当前访问地址</dt><dd id="settings-access-url">—</dd></div></dl></section>
          </div>
          <div class="end-mark" aria-hidden="true"><span></span> STARDUST</div>
          <div id="setup-state-error" class="setup-state-error" role="alert" hidden>无法读取初始化状态。<button type="button" id="setup-retry">重试</button></div>
        </main>
      </div>
    </div>
    <dialog id="setup-dialog" class="setup-dialog" aria-labelledby="setup-heading">
      <form id="setup-form" novalidate>
        <div class="setup-topline">
          <span class="setup-kicker">STARDUST / SETUP</span>
          <label class="theme-control" for="setup-theme-select">主题
            <select id="setup-theme-select" aria-label="向导主题"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select>
          </label>
        </div>
        <div class="setup-step" data-step="0">
          <h2 id="setup-heading">欢迎您使用星尘！</h2>
          <p>本设置向导将引导您一步步配置自己的星屑。</p>
        </div>
        <div class="setup-step" data-step="1" hidden>
          <h2>基础设置</h2>
          <label>服务描述<textarea id="setup-description" name="description" rows="2"></textarea></label>
          <label>WebUI 标题<input id="setup-title" name="title" required></label>
        </div>
        <div class="setup-step" data-step="2" hidden>
          <h2>服务设置</h2>
          <label class="setup-check"><input id="setup-defaults" type="checkbox"> 使用默认监听设置</label>
          <label>监听地址<input id="setup-host" name="host" required></label>
          <label>端口<input id="setup-port" name="port" type="number" min="1" max="65535" step="1" required></label>
          <p>修改监听地址或端口后需要重启才能生效。</p>
        </div>
        <div class="setup-step" data-step="3" hidden>
          <h2>确认配置</h2>
          <dl class="setup-summary">
            <div><dt>服务描述</dt><dd id="summary-description"></dd></div>
            <div><dt>WebUI 标题</dt><dd id="summary-title"></dd></div>
            <div><dt>监听地址</dt><dd id="summary-host"></dd></div>
            <div><dt>端口</dt><dd id="summary-port"></dd></div>
          </dl>
        </div>
        <p id="setup-error" class="setup-error" role="alert" hidden></p>
        <div class="setup-actions">
          <button type="button" id="setup-back" class="setup-secondary" hidden>上一步</button>
          <button type="button" id="setup-next" class="setup-primary">下一步</button>
          <button type="submit" id="setup-submit" class="setup-primary" hidden>完成初始化</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
